<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevQuest - Learn with Levels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a2e0d5d5c2.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gradient-to-br from-blue-200 to-indigo-400 text-white font-sans">

    <div class="min-h-screen flex">

        <!-- Sidebar -->
        <aside class="w-1/4 bg-purple-900 p-6 flex flex-col justify-between rounded-r-3xl shadow-xl">
            <div>
                <div class="text-center mb-6">
                    <img src="https://i.ibb.co/FzY0w6x/avatar.png" alt="avatar"
                        class="w-24 mx-auto rounded-full border-4 border-yellow-400" />
                    <h2 class="mt-3 text-2xl font-bold">Aayush</h2>
                    <p class="text-yellow-300 text-lg">Level 5</p>
                </div>

                <!-- XP Bar -->
                <div class="mb-6">
                    <div class="bg-purple-700 rounded-full h-3">
                        <div class="bg-yellow-400 h-3 rounded-full w-[70%]"></div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="space-y-3">
                    <button class="bg-purple-800 w-full py-2 rounded-lg">Quests</button>
                    <button class="bg-purple-800 w-full py-2 rounded-lg">Inventory</button>
                    <button class="bg-purple-800 w-full py-2 rounded-lg">Leaderboard</button>
                    <button id="changeProfileBtn" class="bg-yellow-400 text-black w-full py-2 rounded-lg mt-4">✏️ Change
                        Profile</button>

                </div>

                <button id="resetAllProgressBtn"
                    class="bg-red-700 hover:bg-red-800 text-white w-full py-2 rounded-lg mt-4 font-bold">
                    ⚠️ Reset All Progress
                </button>

            </div>
        </aside>

        <!-- Main Map Section -->
        <main class="flex-1 p-10 relative">
            <div class="bg-blue-300 rounded-xl p-6 relative h-full shadow-2xl">

                <!-- Challenge Box -->
                <div
                    class="absolute top-6 left-1/2 -translate-x-1/2 bg-yellow-300 text-purple-900 font-semibold px-6 py-2 rounded-xl shadow-md z-10">
                    Next Challenge: Build a Responsive Page!
                </div>

                <!-- Map Areas -->
                <div class="grid grid-cols-3 gap-6 mt-20">

                    <div>
                        <a href="html-island.html"
                            class="bg-green-600 p-6 rounded-2xl flex flex-col items-center justify-center shadow-lg hover:scale-105 transition">
                            <i class="fas fa-scroll text-3xl mb-3"></i>
                            <h3 class="text-xl font-bold">HTML Island</h3>
                        </a>

                    </div>
                    <div>
                        <a href="css-cove.html"
                            class="bg-green-600 p-6 rounded-2xl flex flex-col items-center justify-center shadow-lg hover:scale-105 transition">
                            <i class="fas fa-scroll text-3xl mb-3"></i>
                            <h3 class="text-xl font-bold">CSS COVE</h3>
                        </a>

                    </div>
                    <div>
                        <a href="js-jungle.html"
                            class="bg-green-600 p-6 rounded-2xl flex flex-col items-center justify-center shadow-lg hover:scale-105 transition">
                            <i class="fas fa-scroll text-3xl mb-3"></i>
                            <h3 class="text-xl font-bold">JS JUNGLE</h3>
                        </a>

                    </div>
                </div>
            </div>

            <!-- Bottom Menu -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-6 text-lg">
                <button class="bg-purple-800 px-6 py-2 rounded-lg">Explore</button>
                <button class="bg-purple-800 px-6 py-2 rounded-lg">Quests</button>
                <button class="bg-yellow-500 px-6 py-2 rounded-lg text-purple-900">Leaderboard</button>
            </div>
        </main>
    </div>


    <!-- User Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl text-center max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4 text-purple-700">Customize Your Profile</h2>

            <input id="playerName" type="text" placeholder="Enter your name"
                class="border p-2 w-full mb-4 rounded-lg text-black placeholder-gray-700" />

            <div class="flex justify-center mb-4 space-x-4">
                <img src="avatar-1.jpg"
                    class="avatar-option w-12 h-12 rounded-full border-2 cursor-pointer">
                <img src="avatar-2.jpg"
                    class="avatar-option w-12 h-12 rounded-full border-2 cursor-pointer">
                <img src="avatar-3.jpg"
                    class="avatar-option w-12 h-12 rounded-full border-2 cursor-pointer">
            </div>

            <button id="saveProfile" class="bg-purple-700 text-white px-4 py-2 rounded-lg w-full mb-2">💾 Save
                Profile</button>

            <button id="resetProfile" class="bg-red-500 text-white px-4 py-2 rounded-lg w-full">♻️ Reset
                Profile</button>
        </div>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="resetConfirmModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl text-center max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4 text-red-600">⚠️ Confirm Reset</h2>
            <p class="mb-4 text-gray-700">Are you sure you want to reset your profile? This will remove your name and
                avatar.</p>
            <div class="flex justify-center space-x-4">
                <button id="confirmReset" class="bg-red-500 text-white px-4 py-2 rounded-lg">Yes, Reset</button>
                <button id="cancelReset" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">Cancel</button>
            </div>
        </div>
    </div>


    <script>
        window.onload = () => {

            if (!localStorage.getItem("hasVisited")) {
                localStorage.setItem("htmlCompleted", "false");
                localStorage.setItem("cssCompleted", "false");
                localStorage.setItem("jsCompleted", "false");
                localStorage.setItem("hasVisited", "true"); // mark that user has visited
            }

            const levels = [
                { id: "htmlCompleted", href: "html-island.html" },
                { id: "cssCompleted", href: "css-cove.html" },
                { id: "jsCompleted", href: "js-jungle.html" },
            ];

            levels.forEach(level => {
                if (localStorage.getItem(level.id) === "true") {
                    const card = document.querySelector(`a[href="${level.href}"]`);
                    if (card) {
                        card.innerHTML += '<span class="text-sm text-green-700 font-bold mt-2">✅ Completed</span>';
                    }
                }
            });

            const savedName = localStorage.getItem("playerName") || "Player";
            const savedAvatar = localStorage.getItem("playerAvatar") || "https://i.ibb.co/FzY0w6x/avatar.png";
            document.querySelector("aside h2").textContent = savedName;
            document.querySelector("aside img").src = savedAvatar;

            if (!localStorage.getItem("playerName")) {
                document.getElementById("profileModal").classList.remove("hidden");
            }

            document.querySelectorAll(".avatar-option").forEach(img => {
                img.addEventListener("click", () => {
                    document.querySelectorAll(".avatar-option").forEach(i => i.classList.remove("border-purple-700"));
                    img.classList.add("border-purple-700");
                    localStorage.setItem("selectedAvatar", img.src);
                });
            });

            document.getElementById("saveProfile").addEventListener("click", () => {
                const name = document.getElementById("playerName").value.trim() || "Player";
                const avatar = localStorage.getItem("selectedAvatar") || "avatar.jpg";
                localStorage.setItem("playerName", name);
                localStorage.setItem("playerAvatar", avatar);
                document.querySelector("aside h2").textContent = name;
                document.querySelector("aside img").src = avatar;
                document.getElementById("profileModal").classList.add("hidden");
            });

            document.getElementById("changeProfileBtn").addEventListener("click", () => {
                const savedName = localStorage.getItem("playerName") || "Player";
                const savedAvatar = localStorage.getItem("playerAvatar") || "avatar-1.jpg";
                document.getElementById("playerName").value = savedName;

                document.querySelectorAll(".avatar-option").forEach(img => {
                    if (img.src === savedAvatar) {
                        img.classList.add("border-purple-700");
                    } else {
                        img.classList.remove("border-purple-700");
                    }
                });

                document.getElementById("profileModal").classList.remove("hidden");
            });

            // 🌟 Reset Profile button → opens confirmation popup
            document.getElementById("resetProfile").addEventListener("click", () => {
                document.getElementById("resetConfirmModal").classList.remove("hidden");
            });

            // 🌟 Confirm reset → clears data
            document.getElementById("confirmReset").addEventListener("click", () => {
                localStorage.removeItem("playerName");
                localStorage.removeItem("playerAvatar");
                localStorage.removeItem("selectedAvatar");
                document.querySelector("aside h2").textContent = "Player";
                document.querySelector("aside img").src = "https://i.ibb.co/FzY0w6x/avatar.png";
                document.getElementById("profileModal").classList.add("hidden");
                document.getElementById("resetConfirmModal").classList.add("hidden");
            });

            // 🌟 Cancel reset → just close the popup
            document.getElementById("cancelReset").addEventListener("click", () => {
                document.getElementById("resetConfirmModal").classList.add("hidden");
            });

            document.getElementById("resetAllProgressBtn").addEventListener("click", () => {
                if (confirm("⚠️ Are you sure you want to reset ALL progress and profile?")) {
                    // Reset level progress
                    localStorage.setItem("htmlCompleted", "false");
                    localStorage.setItem("cssCompleted", "false");
                    localStorage.setItem("jsCompleted", "false");

                    // Reset profile
                    localStorage.removeItem("playerName");
                    localStorage.removeItem("playerAvatar");
                    localStorage.removeItem("selectedAvatar");

                    // Remove visited flag so first-time logic works again
                    localStorage.removeItem("hasVisited");

                    // Reload the page
                    location.reload();
                }
            });

        };


    </script>




</body>

</html>
